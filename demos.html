<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project walkthroughs · Zayan Haroon Moosa</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101b21;color:#eff4ef;font:16px/1.65 system-ui,sans-serif}main{max-width:1060px;margin:auto;padding:40px 24px}a{color:#b8eccb}h1{font-size:clamp(30px,5vw,48px);line-height:1.1;letter-spacing:-.04em}p{color:#b3c2c7}.label{color:#b8eccb;font:12px monospace;letter-spacing:.12em}.selectors{display:flex;flex-wrap:wrap;gap:10px;margin:30px 0}button{font:inherit;cursor:pointer;border:1px solid #486069;border-radius:5px;background:#16252c;color:#eff4ef;padding:10px 16px}button[aria-pressed=true],#next{background:#b8eccb;color:#101b21}button:focus-visible,a:focus-visible{outline:3px solid #ffbd8c;outline-offset:4px}.panel{border:1px solid #486069;border-radius:8px;padding:30px;background:#16252c}.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:26px 0}.node{border:1px solid #486069;padding:20px;border-radius:5px}.node.active{border-color:#b8eccb;background:#203b34}.node small{display:block;color:#b8eccb;margin-bottom:12px}.example{padding:20px;border-left:3px solid #b8eccb;background:#101b21;white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.8 monospace}footer{display:flex;flex-wrap:wrap;gap:20px;align-items:center;margin-top:26px}.disclaimer{font-size:13px}@media(max-width:650px){.flow{grid-template-columns:1fr}.panel{padding:20px}}
</style></head><body><main><a href="index.html">← Back to portfolio</a><p class="label">PERSONAL PROJECTS / GUIDED WALKTHROUGHS</p><h1>See the workflow before the code.</h1><p>Explore four tools with synthetic examples. These illustrated walkthroughs explain the workflows; they are not recordings of live AWS runs and do not call AWS.</p><div class="selectors" aria-label="Choose a project"><button data-project="backup" aria-pressed="true">Backup & Restore</button><button data-project="migration" aria-pressed="false">Migration</button><button data-project="scanner" aria-pressed="false">Access Scanner</button><button data-project="secrets" aria-pressed="false">Secrets Manager</button></div><section class="panel" aria-live="polite"><p class="label" id="counter"></p><h2 id="title"></h2><p id="description"></p><div class="flow" id="flow"></div><div class="example" id="example"></div><p class="disclaimer" id="limitation"></p><footer><button id="next">Next step →</button><a id="source" href="https://github.com/Zayan15/quicksight-backup-restore">Read source and setup ↗</a></footer></section><noscript><p>Enable JavaScript for the guided steps. All project descriptions and repository links remain available on the <a href="index.html#projects">portfolio</a>.</p></noscript></main><script>
const projects={
backup:{title:'QuickSight Backup & Restore',repo:'quicksight-backup-restore',description:'Select a dashboard, export its asset bundle, and store it in S3 for a later restore.',steps:[['Discover','List available dashboards','Dashboard: Demo Sales Overview\nAsset: dashboard/demo-sales'],['Export & store','Export dependencies and save the bundle','QuickSight export → asset bundle (.qs)\nS3 destination: example-backups/'],['Restore','Choose an S3 bundle to import','Selected: s3://example-backups/demo-sales.qs\nImport can create or update QuickSight resources.']],limit:'Illustration only. A backup is not proof of recoverability; verify restoration in an authorized sandbox.'},
migration:{title:'QuickSight Migration Toolkit',repo:'quicksight-migration',description:'Map dataset references between accounts before creating an analysis and dashboard from a template.',steps:[['Map','Match source and target datasets','Demo mapping\nsource-sales → target-sales'],['Create','Build target analysis and dashboard','Template → target analysis → target dashboard\nTheme and sharing operations follow.'],['Verify','Inspect the target resources','Manually verify dataset references, visuals,\npermissions, and dashboard behavior.']],limit:'The implementation uses fixed waits; live readiness and cross-account compatibility need validation.'},
scanner:{title:'Dashboard Access Scanner',repo:'quicksight-access-scanner',description:'Inventory dashboards and sharing principals, then export review data.',steps:[['Inventory','Discover dashboards','Demo Sales Overview\nDemo Operations Summary'],['Inspect','Review sharing indicators','Demo Sales Overview → demo-reviewers group\nDemo Operations Summary → demo-author user'],['Export','Download review data','dashboard,sharing_indicator\nDemo Sales Overview,group principal found\nDemo Operations Summary,user principal found']],limit:'Sharing indicators are heuristic. Publication timestamps do not measure dashboard usage.'},
secrets:{title:'Secrets Manager Bulk Tool',repo:'secrets-manager-bulk-tool',description:'Process spreadsheet-driven operations and record row status.',steps:[['Prepare','Review spreadsheet rows','Synthetic row: demo/service-a\nNo real secret value is included in this example.'],['Process','Apply configured secret operations','The real script sends requests to Secrets Manager.\nThis walkthrough executes no operations.'],['Report','Inspect processing status','demo/service-a → example completed status\nResource references support operator follow-up.']],limit:'The prototype includes permanent deletion behavior. Inspect the code and limit permissions before use.'}
};let current='backup',step=0;function render(){const p=projects[current];document.getElementById('counter').textContent=`SYNTHETIC EXAMPLE · STEP ${step+1} OF 3`;document.getElementById('title').textContent=p.title;document.getElementById('description').textContent=p.description;document.getElementById('flow').replaceChildren(...p.steps.map((s,i)=>{const d=document.createElement('div');d.className='node'+(i===step?' active':'');const n=document.createElement('small');n.textContent=`0${i+1} / ${s[0]}`;const t=document.createElement('div');t.textContent=s[1];d.append(n,t);return d}));document.getElementById('example').textContent=p.steps[step][2];document.getElementById('limitation').textContent=p.limit;document.getElementById('source').href=`https://github.com/Zayan15/${p.repo}`;document.getElementById('next').textContent=step===2?'Restart walkthrough ↺':'Next step →';document.querySelectorAll('[data-project]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.project===current)))}document.querySelectorAll('[data-project]').forEach(b=>b.addEventListener('click',()=>{current=b.dataset.project;step=0;render()}));document.getElementById('next').addEventListener('click',()=>{step=(step+1)%3;render()});render();
</script></body></html>
